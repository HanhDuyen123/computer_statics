<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Alena UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .header-desktop {
            background-color: #2a9d8f;
            color: white;
        }
        .header-mobile {
            background-color: #2a9d8f;
        }
        .header-mobile .btn {
            color: white;
        }
        .carousel img {
            height: 300px;
            object-fit: cover;
        }
        .card img {
            height: 150px;
            object-fit: cover;
        }
        .btn-custom {
            background-color: #f4a261;
            color: white;
            border: none;
        }
        .btn-custom:hover {
            background-color: #e76f51;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <!-- Desktop Header -->
        <div class="d-none d-lg-block header-desktop py-2">
            <div class="container d-flex justify-content-between align-items-center">
                <a href="#" class="navbar-brand text-white fw-bold">Alena</a>
                <div class="d-flex align-items-center">
                    <input type="text" class="form-control me-2" placeholder="Tìm sản phẩm bạn mong muốn">
                    <button class="btn btn-custom">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <div class="d-flex align-items-center">
                    <a href="#" class="text-white me-3">
                        <i class="fas fa-user"></i> Đăng nhập / Đăng ký
                    </a>
                    <a href="#" class="text-white">
                        <i class="fas fa-shopping-cart"></i>
                    </a>
                </div>
                <span class="text-white">Hotline: 1900 6750</span>
            </div>
        </div>

        <!-- Mobile Header -->
        <div class="d-lg-none header-mobile py-2">
            <div class="container d-flex justify-content-between align-items-center">
                <button class="btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
                    <i class="fas fa-bars"></i>
                </button>
                <a href="#" class="navbar-brand text-white fw-bold">Alena</a>
                <a href="#" class="text-white">
                    <i class="fas fa-shopping-cart"></i>
                </a>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div class="offcanvas offcanvas-start" id="mobileMenu">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title">Menu</h5>
                <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body">
                <input type="text" class="form-control mb-3" placeholder="Tìm sản phẩm bạn mong muốn">
                <a href="#" class="d-block mb-2">
                    <i class="fas fa-user"></i> Đăng nhập / Đăng ký
                </a>
                <a href="#" class="d-block">
                    <i class="fas fa-phone"></i> Hotline: 1900 6750
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container mt-3">
            <!-- Slide Section -->
            <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="https://via.placeholder.com/800x300" class="d-block w-100" alt="Slide 1">
                    </div>
                    <div class="carousel-item">
                        <img src="https://via.placeholder.com/800x300" class="d-block w-100" alt="Slide 2">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                </button>
            </div>

            <!-- Product Section -->
            <h3 class="mt-4">Sản phẩm hot</h3>
            <div class="row">
                <div class="col-6 col-md-4">
                    <div class="card">
                        <img src="https://via.placeholder.com/150" class="card-img-top" alt="Product 1">
                        <div class="card-body">
                            <p class="card-text fw-bold">
                                <i class="fas fa-tshirt"></i> Quần áo
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="card">
                        <img src="https://via.placeholder.com/150" class="card-img-top" alt="Product 2">
                        <div class="card-body">
                            <p class="card-text fw-bold">
                                <i class="fas fa-gem"></i> Phụ kiện
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="card">
                        <img src="https://via.placeholder.com/150" class="card-img-top" alt="Product 3">
                        <div class="card-body">
                            <p class="card-text fw-bold">
                                <i class="fas fa-shoe-prints"></i> Giày dép
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
