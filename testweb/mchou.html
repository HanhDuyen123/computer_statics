<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 20px;
        }
        .table thead th {
            background-color: #f8f9fa;
        }
        .btn-delete {
            color: red;
            border: none;
            background: none;
        }
        .btn-delete:hover {
            color: darkred;
        }
    </style>
</head>
<body>
    <div class="container">
        <h4>Giỏ hàng</h4>
        <div class="row mt-4">
            <!-- Thông tin người đặt hàng -->
            <div class="col-12 col-lg-6">
                <h5>Thông tin người đặt hàng</h5>
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Họ tên <span class="text-danger">(*)</span></label>
                        <input type="text" class="form-control" id="name" placeholder="Nhập họ tên">
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">Địa chỉ <span class="text-danger">(*)</span></label>
                        <input type="text" class="form-control" id="address" placeholder="Nhập địa chỉ">
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Điện thoại <span class="text-danger">(*)</span></label>
                        <input type="tel" class="form-control" id="phone" placeholder="Nhập số điện thoại">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Lời nhắn:</label>
                        <textarea class="form-control" id="message" rows="3" placeholder="Nhập lời nhắn (nếu có)"></textarea>
                    </div>
                </form>
            </div>

            <!-- Sản phẩm đã chọn -->
            <div class="col-12 col-lg-6">
                <h5>Sản phẩm đã chọn</h5>
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">STT</th>
                            <th scope="col">Tên sản phẩm</th>
                            <th scope="col">Giá</th>
                            <th scope="col">Số lượng</th>
                            <th scope="col">Thành tiền</th>
                            <th scope="col">Xóa</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Nhà gỗ Đà Lạt đẹp</td>
                            <td>0 đ</td>
                            <td>
                                <input type="number" class="form-control" value="1" style="width: 70px;">
                            </td>
                            <td>0 đ</td>
                            <td>
                                <button class="btn-delete">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="d-flex justify-content-between">
                    <a href="#" class="text-danger">Tiếp tục mua hàng</a>
                    <h5 class="text-end">Tổng tiền: <span class="text-danger">0 đ</span></h5>
                </div>
                <div class="mt-3">
                    <select class="form-select mb-3" aria-label="Chọn phương thức thanh toán">
                        <option value="COD">Thanh toán khi nhận hàng</option>
                        <option value="bank">Chuyển khoản ngân hàng</option>
                    </select>
                    <button class="btn btn-warning w-100">Đặt hàng</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>
</html>
